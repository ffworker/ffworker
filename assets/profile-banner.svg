<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Dennis Kappel / ffworker</title>
  <desc id="desc">Infrastructure, Linux, Kubernetes and automation portfolio banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#10172a"/>
      <stop offset="100%" stop-color="#17102b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="26" fill="url(#grid)"/>

  <circle cx="1085" cy="85" r="140" fill="#2563eb" opacity="0.10"/>
  <circle cx="1190" cy="260" r="120" fill="#a855f7" opacity="0.09"/>

  <g opacity="0.5" stroke="#67e8f9" stroke-width="2">
    <path d="M944 96 L1028 64 L1114 112 L1186 72" fill="none"/>
    <path d="M1028 64 L1066 156 L1140 200 L1210 158" fill="none"/>
    <path d="M944 96 L978 208 L1066 156" fill="none"/>
    <path d="M978 208 L1060 274 L1140 200 L1210 252" fill="none"/>
  </g>
  <g fill="#0b1020" stroke="url(#accent)" stroke-width="3" filter="url(#glow)">
    <circle cx="944" cy="96" r="7"/>
    <circle cx="1028" cy="64" r="7"/>
    <circle cx="1114" cy="112" r="7"/>
    <circle cx="1186" cy="72" r="7"/>
    <circle cx="1066" cy="156" r="7"/>
    <circle cx="1140" cy="200" r="7"/>
    <circle cx="1210" cy="158" r="7"/>
    <circle cx="978" cy="208" r="7"/>
    <circle cx="1060" cy="274" r="7"/>
    <circle cx="1210" cy="252" r="7"/>
  </g>

  <rect x="76" y="65" width="164" height="32" rx="16" fill="#0f2133" stroke="#67e8f9" stroke-opacity="0.45"/>
  <text x="158" y="86" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#a5f3fc" letter-spacing="1.2">FFWORKER</text>

  <text x="76" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="#f8fafc">Dennis Kappel</text>
  <text x="76" y="204" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1">Infrastructure · Linux · Kubernetes · Automation</text>

  <rect x="76" y="238" width="624" height="3" rx="2" fill="url(#accent)"/>

  <text x="76" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8">BUILD  /  BREAK  /  AUTOMATE  /  REPEAT</text>
  <text x="76" y="323" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">Practical systems, reproducible labs, useful tooling.</text>
</svg>
